# Same as dummy.yaml but script.engine: ollama (mocked in the batch
# happy-path test via echoface.stages.script.call_ollama), since
# `echoface batch` always generates a script per topic and has no
# --script-file equivalent — see tests/e2e/test_batch.py.
presenter: smoketest
language: en
target_seconds: 12
monetized: false

script:
  engine: ollama
  model: qwen2.5:7b
  host: http://localhost:11434
  max_retries: 3

voice:
  engine: dummy
  pause_ms: 150

face:
  engine: dummy
  source: photo
  restore: none
  device: cpu

captions:
  engine: dummy
  max_words_per_line: 3
  font_size: 80

compose:
  width: 1080
  height: 1920
  fps: 30
  layout: face_top
  background: null
  background_color: "0x101018"
  music: null
  duck_under_voice: false
  loudness_lufs: -14
  crf: 20
  disclosure_line: "Presenter is AI-generated."
