# Config used by the end-to-end smoke test: dummy voice/face engines so it
# runs with no GPU, no Ollama, no Piper/Wav2Lip installed — pure ffmpeg.
presenter: smoketest
language: en
target_seconds: 12
monetized: false

script:
  engine: file

voice:
  engine: dummy
  pause_ms: 150

face:
  engine: dummy
  source: photo
  restore: none
  device: cpu

captions:
  engine: dummy
  max_words_per_line: 3
  font_size: 80

compose:
  width: 1080
  height: 1920
  fps: 30
  layout: face_top
  background: null
  background_color: "0x101018"
  music: null
  duck_under_voice: false
  loudness_lufs: -14
  crf: 20
  disclosure_line: "Presenter is AI-generated."
